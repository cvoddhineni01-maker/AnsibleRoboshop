- name: Creating route 53 and ec2 instances
  hosts: localhost
  connection: local
  vars: 
   ami_id: ami-0220d79f3f480ecf5
   sg_id: sg-0db110084486818ff
   zone_id: "Z05660673G75FK1II7TFX"
   domain_name: "devopsplayground.fun"
   instances:
    - mongoDB
    - redis
    - mysql
    - rabbitmq
    - catalogue
    - user
    - cart
    - shipping
    - payment


  tasks:
    - name: Create EC2 instances
      amazon.aws.ec2_instance:
       name: "{{ item }}"
       instance_type: t3.micro
       security_group: "{{ sg_id }}"
       image_id: "{{ ami_id }}"
       tags:
         name: "{{ item }}"
      loop:  "{{instances}}"
      register: ec2_output

    #- name: Print the ec2 ec2_output
    #  ansible.builtin.debug:
    #    msg: "{{ ec2_output }}"

    #- name: Print the Ec2 Public IP addresss
    #  ansible.builtin.debug:
    #   msg: "{{item.instances[0].public_ip_address}}"
    #  loop: "{{ ec2_output.results }}"
    - name: Create Route 53 
      amazon.aws.route53:
       state: present
       zone: "{{ domain_name }}"
       record: "{{item.item}}.{{domain_name}}" 
       type: A
       ttl: 1
       value: "{{item.instances[0].private_ip_address}}"
      loop: "{{ ec2_output.results }}"